name: Build Arabic Vencord Installer

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - .github/workflows/arabic-installer.yml
            - src/plugins/arabicDiscord/**

permissions:
    contents: write

env:
    FORCE_COLOR: true

jobs:
    build:
        name: Build Windows installer
        runs-on: windows-latest

        steps:
            - name: Check out Vencord
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Vencord dependencies
              run: pnpm install --frozen-lockfile

            - name: Build standalone Vencord
              run: pnpm build --standalone

            - name: Check out the official installer source
              run: git clone --depth 1 https://github.com/Vencord/Installer.git installer

            - name: Point the installer at this repository
              shell: pwsh
              run: |
                  $releaseApi = "https://api.github.com/repos/${{ github.repository }}/releases/latest"
                  $constantsPath = "installer/constants.go"
                  $constants = Get-Content -LiteralPath $constantsPath -Raw
                  $constants = $constants.Replace('const ReleaseUrl = "https://api.github.com/repos/Vendicated/Vencord/releases/latest"', "const ReleaseUrl = `"$releaseApi`"")
                  $constants = $constants.Replace('const ReleaseUrlFallback = "https://vencord.dev/releases/vencord"', "const ReleaseUrlFallback = `"$releaseApi`"")
                  $constants = $constants.Replace('var UserAgent = "VencordInstaller/" + buildinfo.InstallerGitHash + " (https://github.com/Vencord/Installer)"', 'var UserAgent = "ArabicVencordInstaller/" + buildinfo.InstallerGitHash + " (https://github.com/${{ github.repository }})"')
                  Set-Content -LiteralPath $constantsPath -Value $constants -Encoding utf8NoBOM

            - name: Set up MSYS2 build tools
              uses: msys2/setup-msys2@v2
              with:
                  update: true
                  install: >-
                      git
                      mingw-w64-x86_64-gcc
                      mingw-w64-x86_64-SDL2
                      mingw-w64-x86_64-go

            - name: Build ArabicVencordInstaller.exe
              shell: msys2 {0}
              working-directory: installer
              run: |
                  export GOROOT=/mingw64/lib/go
                  export GOPATH=/mingw64
                  go install github.com/tc-hib/go-winres@latest
                  go-winres make --product-version 1.0.0
                  installer_hash="$(git rev-parse --short HEAD)"
                  CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags static -ldflags "-s -w -H=windowsgui -extldflags=-static -X vencordinstaller/buildinfo.InstallerGitHash=$installer_hash" -o ../ArabicVencordInstaller.exe

            - name: Upload installer artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ArabicVencordInstaller
                  path: ArabicVencordInstaller.exe
                  if-no-files-found: error

            - name: Publish GitHub release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $shortSha = "${{ github.sha }}".Substring(0, 7)
                  $tag = "arabic-$shortSha"
                  $title = "Arabic Vencord $shortSha"
                  gh release create $tag --target "${{ github.sha }}" --title $title --notes "Vencord with ArabicDiscord enabled by default. Run ArabicVencordInstaller.exe to install it." --latest
                  gh release upload $tag ArabicVencordInstaller.exe dist/patcher.js dist/preload.js dist/renderer.js dist/renderer.css --clobber
